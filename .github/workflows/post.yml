name: Threads 自動投稿

on:
  schedule:
    # 5分ごとに起動（実際はGitHubの間引きで1日数回）。予定時刻を過ぎた枠を投稿し、次の枠が近ければ待って投稿する。
    # 1日5件（運用者指定で固定）・朝昼夜のピーク重視・投稿時刻は毎日変動（src/schedule.ts）。
    # UTCの 00:00-14:59 と 22:00-23:59（= JST 07:00-23:59）のみ起動。
    - cron: "*/5 0-14,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "スケジュールを無視して今すぐ1投稿する（テスト用）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # src/post.ts は次の枠まで最大300分待機して投稿する（起動の間引き対策）
    timeout-minutes: 340
    steps:
      # 待機中の run の後ろで待たされた run が、トリガー時点の古い状態で二重投稿しないよう、
      # ジョブ開始時点のブランチ先端をチェックアウトする
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 投稿（予定時刻なら生成して公開）
        run: npm run post
        env:
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}

      - name: 投稿履歴・スケジュール状態をコミット
        if: always()
        run: 'bash .github/scripts/commit-state.sh "chore: 投稿状態を更新 [skip ci]"'
