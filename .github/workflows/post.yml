name: Threads 自動投稿

on:
  schedule:
    # 10分ごとに起動し、その日の投稿予定時刻になったら1件投稿する。
    # 1日30件・朝昼夜のピーク重視・投稿時刻は毎日変動（src/schedule.ts）。
    # UTCの 00:00-14:59 と 22:00-23:59（= JST 07:00-23:59）のみ起動。
    - cron: "*/10 0-14,22,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "スケジュールを無視して今すぐ1投稿する（テスト用）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 投稿（予定時刻なら生成して公開）
        run: npm run post
        env:
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USERNAME: ${{ secrets.THREADS_USERNAME }}

      - name: 投稿履歴・スケジュール状態をコミット
        if: always()
        run: 'bash .github/scripts/commit-state.sh "chore: 投稿状態を更新 [skip ci]"'
